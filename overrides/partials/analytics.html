<!--
  Cloudflare Web Analytics.

  Chosen over Google Analytics deliberately. GA4 sets cookies, which under GDPR
  requires a consent banner — friction on a research site, and consent-mode gaps
  degrade the data anyway. This is cookie-free, so no banner is needed, and for
  a project whose subject is measurement integrity the choice is not incidental.

  To activate: Cloudflare dashboard -> Analytics & Logs -> Web Analytics ->
  Add a site -> copy the token into CF_ANALYTICS_TOKEN below.
-->
{% if config.extra.cf_analytics_token %}
<script defer src="https://static.cloudflareinsights.com/beacon.min.js"
        data-cf-beacon='{"token": "{{ config.extra.cf_analytics_token }}"}'></script>
{% endif %}
