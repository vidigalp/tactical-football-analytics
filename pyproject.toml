[project]
name = "tfa"
version = "0.1.0"
description = "Learning football tactics through statistics — reproducible, cited, and honest about uncertainty."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pedro Vidigal", email = "vidigalp@users.noreply.github.com" }]
requires-python = ">=3.13,<3.15"

dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "requests>=2.32",
]

[project.optional-dependencies]
# Enrichment sources are optional and NEVER required for a reproducible run.
# See DATA_SOURCES.md for the licensing boundary this enforces.
enrichment = ["soccerdata>=1.9.1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test requires network access (deselect with -m 'not network')",
]
