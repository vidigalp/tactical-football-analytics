site_name: Pedro Vidigal
site_description: Applied statistics and machine learning on datasets people argue about.
site_url: https://pedrovidigal.com/
repo_url: https://github.com/vidigalp/tactical-football-analytics
repo_name: vidigalp/tactical-football-analytics
extra:
  # Set once from the Cloudflare dashboard; cookie-free, so no consent
  # banner is required. Left empty until then rather than shipping a
  # broken beacon.
  cf_analytics_token: ""
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/pvidigal/
      name: Pedro Vidigal on LinkedIn
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/PedroCAVidigal
      name: Pedro Vidigal on X
    - icon: fontawesome/brands/github
      link: https://github.com/vidigalp
      name: Pedro Vidigal on GitHub

copyright: Code MIT · Text, figures and derived data CC BY 4.0

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search
  - redirects:
      redirect_maps:
        # The site launched on a GitHub Pages path with week-numbered URLs.
        # Those are kept resolvable: a project whose premise is that cited
        # artifacts stay reachable does not get to break its own links.
        weekly/2026-W35.md: studies/01-free-football-data.md
        weekly/2026-W36.md: studies/02-fouling-with-impunity.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences

nav:
  - Home: index.md
  - Studies:
      - "02 — A club that fouls with impunity, and three ways I was wrong": studies/02-fouling-with-impunity.md
      - "01 — What free football data can still tell you": studies/01-free-football-data.md
  - Method:
      - Methods: methods.md
      - Editorial policy: editorial.md
      - Data and provenance: data-sources.md
      - AI workflow: ai-workflow.md
      - Acknowledgements: acknowledgements.md
  - Learning log: learning-log.md
