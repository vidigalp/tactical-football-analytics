site_name: tactical-football-analytics
site_description: Learning football tactics through statistics — reproducibly, with citations.
site_url: https://vidigalp.github.io/tactical-football-analytics/
repo_url: https://github.com/vidigalp/tactical-football-analytics
repo_name: vidigalp/tactical-football-analytics
copyright: Code MIT · Text, figures and derived data CC BY 4.0

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences

nav:
  - Home: index.md
  - Weekly:
      - "Week 2 — A club that fouls with impunity, and three ways I was wrong": weekly/2026-W36.md
      - "Week 1 — What free football data can still tell you": weekly/2026-W35.md
  - Method:
      - Methods: methods.md
      - Editorial policy: editorial.md
      - Data and provenance: data-sources.md
      - AI workflow: ai-workflow.md
      - Acknowledgements: acknowledgements.md
  - Learning log: learning-log.md
