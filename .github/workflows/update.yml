name: update snapshot and dashboard

# Once a day: fetch football-data.co.uk, write or refresh the week's snapshot,
# regenerate the dashboard dataset, and commit both. Then move the site's content
# pin to that commit, which is what triggers the Cloudflare rebuild.
#
# WHAT THIS PUBLISHES AND WHAT IT DOES NOT. The dashboard is a dataset: every
# club's counts, expectation, interval and percentile, computed by a committed
# script from a committed snapshot. It carries no claim, so it needs no human
# review to ship. The studies and the live page are claims. They are pinned to
# the snapshot they were written from and are NOT rebuilt here; a person re-runs
# their scripts and re-reads their prose when the numbers should move. The
# outlier scan still runs, and lands in the job summary as a list of things a
# person might look at, never as a post.
#
# WHY DAILY, AND WHY 05:23 UTC. football-data.co.uk publishes late in the
# evening UTC: the P1 file's last-modified was 22:39 on Monday 2026-09-07,
# 22:10 on Thursday the 10th and 22:57 on Monday the 14th. A weekly Monday-
# morning run therefore fetched the previous week's rows, found no delta,
# removed its own snapshot and exited green three weeks running, each time
# leaving the dashboard a week stale while looking healthy. Rounds are also not
# weekly: a midweek round publishes on a Wednesday or Thursday night, and a
# rearranged fixture whenever it is played. Running every morning a few hours
# after the publication window catches each of those within a day, and the
# no-change path below costs one fetch and no commit.
#
# WHAT A DAY'S RUN MAY OVERWRITE. Snapshots are still one ISO-week directory,
# so a run later in the same week rewrites that week's files rather than adding
# a directory. A week's snapshot therefore means the state of that week's data
# as of its last fetch, and every earlier state of it remains in this
# repository's history, which is what the reproducibility promise in
# DATA_SOURCES.md rests on. Daily directories were the alternative and were
# rejected: twenty-three scripts find the current data by globbing `*-W*`, and
# at 3.5 MB a snapshot the history would grow by about a gigabyte a year.
#
# WHY THE PARQUET COMPARISON BELOW IS SOUND. Refetching unchanged data produces
# byte-identical parquet files: verified 2026-09-21 by refetching all eleven
# leagues against the committed 2026-W38 snapshot, 11 of 11 identical. Only the
# manifest's timestamps move. So git itself is the change detector, and a day
# with no new matches commits nothing at all.
#
# GitHub's schedule trigger drifts and sometimes skips; see the energy archive's
# workflow for the measurements. Dispatching from an external clock is the
# reliable path and the cron is the fallback, deliberately off the hour.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: write

concurrency:
  group: update-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev

      # SITE_PUSH_TOKEN's only job is to reach a private repository, and when it
      # cannot the failure lands at the very last step of the run, after the
      # snapshot has already been committed. That is how the live dashboard sat
      # four weeks stale: the token was set on 2026-09-08 and never once worked,
      # every run that published failed at "Check out the site", and every run
      # in between had nothing to publish and went green. Check it at the top of
      # every run instead, so a broken token is visible on quiet days too,
      # before anyone is relying on a pin that is not going to move.
      - name: Can the site token see the site
        id: site_token
        env:
          TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            code="unset"
          else
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/vidigalp/pedrovidigal.com)
          fi
          if [ "$code" = "200" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "## The site pin cannot move"
              echo
              echo "\`SITE_PUSH_TOKEN\` cannot read \`vidigalp/pedrovidigal.com\` (API said \`$code\`)."
              echo "A snapshot committed by this run will **not** reach the live site until the"
              echo "token is replaced: mint a fine-grained PAT with Contents: read and write on"
              echo "that repository, then \`gh secret set SITE_PUSH_TOKEN --repo"
              echo "vidigalp/tactical-football-analytics\`. Until then a person must move the pin."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # A week already committed is refreshed in place; a new week is written
      # fresh. The two paths differ only in how "nothing new" is detected, and
      # both must end with nothing committed.
      - name: Is this week's snapshot already committed
        id: week
        run: |
          week="$(date -u +%G-W%V)"
          echo "week=$week" >> "$GITHUB_OUTPUT"
          if git ls-files --error-unmatch "data/snapshots/$week/manifest.json" >/dev/null 2>&1; then
            echo "refreshing the committed snapshot $week in place"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "writing a new snapshot $week"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch every league
        run: uv run python scripts/ingest_matches.py --to 2026

      # Refreshing a committed week: the parquet files are byte-identical when
      # nothing was published, so an unchanged git diff means there is nothing
      # to do. Restore the directory, since the manifest's timestamps always
      # move and would otherwise be committed on their own.
      - name: Did anything actually change
        if: steps.week.outputs.committed == 'true'
        id: refresh
        run: |
          week="${{ steps.week.outputs.week }}"
          if git diff --quiet -- "data/snapshots/$week"/*.parquet; then
            echo "no new matches since the last fetch; nothing to do"
            git checkout -- "data/snapshots/$week"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat -- "data/snapshots/$week"/*.parquet
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A refresh that did change still has to clear the same sanity check as a
      # new week: fewer leagues or fewer rows than the week before is a broken
      # fetch, not new data, and must fail the job. Run the comparison without
      # `--remove-if-unchanged`, because this week's directory is committed and
      # deleting it is never the right answer.
      - name: Sanity-check a refreshed week
        if: steps.refresh.outputs.changed == 'true'
        run: uv run python scripts/snapshot_delta.py

      # Writing a new week. Fewer leagues or fewer rows than last week is a
      # broken fetch and fails the job. The same rows means the source has not
      # published since last week: the directory is removed and nothing is
      # committed. More rows is new data.
      - name: Compare with the previous snapshot
        if: steps.week.outputs.committed == 'false'
        id: delta
        run: uv run python scripts/snapshot_delta.py --remove-if-unchanged

      - name: Decide whether to publish
        id: publish
        run: |
          if [ "${{ steps.refresh.outputs.changed }}" = "true" ] \
          || [ "${{ steps.delta.outputs.changed }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate the dashboard dataset
        if: steps.publish.outputs.changed == 'true'
        run: uv run python scripts/season_dashboard.py

      - name: Check everything that is about to be committed
        if: steps.publish.outputs.changed == 'true'
        run: |
          uv run ruff check .
          uv run pytest -m "not network" -q

      - name: Scan for things a person might look at
        if: steps.publish.outputs.changed == 'true'
        run: |
          {
            echo '## Outlier scan'
            echo
            echo 'Hypotheses, not findings. METHODS.md requires a pre-registration before any of these becomes a claim.'
            echo
            echo '```'
            uv run python scripts/scan_outliers.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the snapshot and the dashboard
        if: steps.publish.outputs.changed == 'true'
        id: commit
        run: |
          git config user.name  "snapshot bot"
          git config user.email "noreply@users.noreply.github.com"
          git add data/snapshots dashboard
          git commit -q -m "Snapshot $(date -u +%G-W%V) and dashboard refresh" \
            -m "Fetched $(date -u +'%Y-%m-%d %H:%M') UTC by the daily update workflow."
          git pull --rebase --quiet
          git push --quiet
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The site mounts this repository as the `content` submodule and copies the
      # dashboard out of it at build time. Moving the pin is the whole deploy.
      - name: Check out the site
        if: steps.publish.outputs.changed == 'true' && steps.site_token.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: vidigalp/pedrovidigal.com
          token: ${{ secrets.SITE_PUSH_TOKEN }}
          path: site
          submodules: false

      - name: Move the site's content pin
        if: steps.publish.outputs.changed == 'true' && steps.site_token.outputs.ok == 'true'
        working-directory: site
        run: |
          git config user.name  "snapshot bot"
          git config user.email "noreply@users.noreply.github.com"
          git submodule update --init content
          git -C content fetch --quiet origin
          git -C content checkout --quiet "${{ steps.commit.outputs.sha }}"
          git add content
          git commit -q -m "Bump content to ${{ steps.commit.outputs.sha }}" \
            -m "Snapshot $(date -u +%G-W%V) and dashboard refresh, committed by the research repository's daily update workflow."
          git pull --rebase --quiet
          git push --quiet

      # A snapshot that landed here but could not reach the site is the exact
      # failure that hid for four weeks, so say it in the summary and fail the
      # run. The data is committed either way; what is lost is the deploy.
      - name: Say that the snapshot did not reach the site
        if: steps.publish.outputs.changed == 'true' && steps.site_token.outputs.ok != 'true'
        run: |
          {
            echo
            echo "Snapshot \`${{ steps.commit.outputs.sha }}\` is committed here but the site still"
            echo "points at the previous one. Move the pin by hand, or fix the token and re-run."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Site pin not moved::SITE_PUSH_TOKEN cannot reach vidigalp/pedrovidigal.com; snapshot ${{ steps.commit.outputs.sha }} is committed but not deployed"
          exit 1
