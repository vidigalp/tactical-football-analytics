name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a reference that rots after publication is caught.
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      # docs/ is generated and gitignored, so a fresh checkout has none. Tests
      # that inspect the site cannot run until it is assembled, and this must
      # mirror scripts/cf_build.sh or CI and the deploy disagree about what
      # passing means -- which is how six red builds went unnoticed.
      - run: uv run python scripts/build_site.py
      - run: uv run ruff check .
      - run: uv run pytest -m "not network"

  citations:
    # Every citation must resolve to a registered DOI whose title matches what we
    # claim it is. This is the structural guard described in AI_WORKFLOW.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run pytest -m network
